name: Secret scan
description: Check tracked sources/history or build artifacts with pinned, verified Gitleaks
inputs:
  artifact-path:
    description: Optional build directory; otherwise scan tracked files and full available history
    required: false
runs:
  using: composite
  steps:
    - name: Install verified scanner
      shell: bash
      run: |
        set -euo pipefail
        tool_dir="$(mktemp -d "$RUNNER_TEMP/lunoria-gitleaks.XXXXXX")"
        archive="$tool_dir/gitleaks.tar.gz"
        curl --fail --silent --show-error --location --retry 3 \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          --output "$archive"
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
        tar -xzf "$archive" -C "$tool_dir" gitleaks
        echo "$tool_dir" >> "$GITHUB_PATH"
    - name: Scan tracked source files
      if: inputs.artifact-path == ''
      shell: pwsh
      run: ./scripts/security/Scan-Secrets.ps1 -Mode WorkingTree
    - name: Scan available Git history
      if: inputs.artifact-path == ''
      shell: pwsh
      run: ./scripts/security/Scan-Secrets.ps1 -Mode History
    - name: Scan deployment artifacts
      if: inputs.artifact-path != ''
      shell: pwsh
      env:
        SCAN_ARTIFACT_PATH: ${{ inputs.artifact-path }}
      run: ./scripts/security/Scan-Secrets.ps1 -Mode Artifacts -ArtifactPath $env:SCAN_ARTIFACT_PATH
