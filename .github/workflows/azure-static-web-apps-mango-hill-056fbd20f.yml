  name: Azure Static Web Apps CI/CD

  on:
    push:
      branches:
        - main
    pull_request:
      types: [opened, synchronize, reopened, closed]
      branches:
        - main
    workflow_dispatch:

  permissions:
    contents: read
    pull-requests: write

  jobs:
    build_and_deploy_job:
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
      runs-on: ubuntu-latest
      name: Build and Deploy

      steps:
        - name: Check out repository
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: "22"
            cache: npm
            cache-dependency-path: Lunoria.Web/package-lock.json

        - name: Install dependencies
          working-directory: Lunoria.Web
          run: npm ci

        - name: Build frontend
          working-directory: Lunoria.Web
          env:
            VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          run: npm run build

        - name: Deploy frontend
          uses: Azure/static-web-apps-deploy@v1
          with:
            azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_HILL_056FBD20F }}
            repo_token: ${{ secrets.GITHUB_TOKEN }}
            action: upload
            app_location: "./Lunoria.Web/dist"
            api_location: ""
            output_location: ""
            skip_app_build: true

    close_pull_request_job:
      if: github.event_name == 'pull_request' && github.event.action == 'closed'
      runs-on: ubuntu-latest
      name: Close Pull Request

      steps:
        - name: Close preview environment
          uses: Azure/static-web-apps-deploy@v1
          with:
            azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_HILL_056FBD20F }}
            action: close
