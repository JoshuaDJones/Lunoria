  # Docs: https://github.com/Azure/webapps-deploy

  name: Build and deploy ASP.NET Core API - lunoria-api-test-jdj01

  on:
    push:
      branches:
        - main
    workflow_dispatch:

  jobs:
    build:
      runs-on: ubuntu-latest
      permissions:
        contents: read

      steps:
        - name: Check out repository
          uses: actions/checkout@v4

        - name: Set up .NET
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: '8.x'

        - name: Build API
          run: dotnet build Eldoria.Api/Eldoria.Api.csproj --configuration Release

        - name: Publish API
          run: dotnet publish Eldoria.Api/Eldoria.Api.csproj --configuration Release --output ./publish

        - name: Upload deployment artifact
          uses: actions/upload-artifact@v4
          with:
            name: .net-app
            path: ./publish

    deploy:
      runs-on: ubuntu-latest
      needs: build
      permissions:
        id-token: write
        contents: read

      steps:
        - name: Download deployment artifact
          uses: actions/download-artifact@v4
          with:
            name: .net-app

        - name: Log in to Azure
          uses: azure/login@v2
          with:
            client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E4D69920029043C68522996B5A6DB86E }}
            tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7894192C8F014E4A816BBC4801DA3EC9 }}
            subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_75BB2AAB84DD4E40A743C9C3685B1F7B }}

        - name: Deploy API to Azure App Service
          uses: azure/webapps-deploy@v3
          with:
            app-name: lunoria-api-test-jdj01
            slot-name: Production
            package: .
